name: One-shot Go module repair
on:
  push:
    branches: [feat/oidc-login]
    paths: ['.github/workflows/oidc-module-repair.yml']
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oidc-login
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Tidy dependencies and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          go test ./internal/handler ./internal/config ./internal/security ./cmd/server
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oidc-module-repair.yml
          git add go.mod go.sum
          git diff --cached --check
          git commit -m "fix(oidc): tidy Go module dependencies"
          git push origin HEAD:feat/oidc-login
